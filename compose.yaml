services:
  personal-website:
    image: ${PERSONAL_WEBSITE_IMAGE:-personal-website}:${TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - web

networks:
  web:
    external: true
