name: docker

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  docker:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    uses: RyanRuiLiu/.github/.github/workflows/docker.yml@9e85e2e21780ed63ba09054f504a8d2139d87a9d
    with:
      tags: |
        type=ref,event=branch
      cache_mode: min
    secrets:
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
      ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}

  deploy:
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: deploy-personal-website
      cancel-in-progress: false
    uses: RyanRuiLiu/.github/.github/workflows/deploy.yml@169a0eb839dd876dbe30a5dd9aa5bd843c73190b
    with:
      hook: deploy-personal-website
    secrets:
      WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
