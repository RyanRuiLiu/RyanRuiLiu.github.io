name: docker

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  docker:
    permissions:
      contents: read
      packages: write
    uses: RyanRuiLiu/.github/.github/workflows/docker.yml@d77ab28fc191b7c00b61318cf0d6cdb6867d8902
    secrets:
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
      ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}

  deploy:
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-personal-website
      cancel-in-progress: false
    steps:
      - name: Deploy
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          curl -fsS --max-time 300 --retry 5 --retry-all-errors -X POST \
            -H "X-Deploy-Token: $WEBHOOK_SECRET" \
            "https://ryanliu.cn/hooks/deploy-personal-website"
